<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bloom &amp; Co. - plants for every home">
  <title>Contact | Bloom &amp; Co.</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="wrap bar">
    <a class="logo" href="index.html">🌿 Bloom <span>&amp;</span> Co.</a>
    <button class="menu-btn" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <nav id="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="tools.html">Tools</a>
      <a href="signup.html" class="pill">Sign up / Log in</a>
    </nav>
  </div>
</header>
<main>

  <section class="wrap narrow">
    <h1>Contact us</h1>
    <form id="contactForm" class="form" novalidate>
      <label>Name <input type="text" id="cName"></label><small class="err" data-for="cName"></small>
      <label>Email <input type="email" id="cEmail"></label><small class="err" data-for="cEmail"></small>
      <label>Topic
        <select id="cTopic"><option value="">Choose…</option><option>General</option><option>Order help</option><option>Plant care</option></select>
      </label><small class="err" data-for="cTopic"></small>
      <label>Message <textarea id="cMsg" rows="5"></textarea></label><small class="err" data-for="cMsg"></small>
      <button class="btn" type="submit">Send message</button>
      <p id="contactOk" class="ok" hidden>Thanks! Your message was received.</p>
    </form>
  </section>
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>&copy; 2026 Bloom &amp; Co. &middot; Modules 1&ndash;5 static site</p>
  </div>
</footer>
</body>
</html>
