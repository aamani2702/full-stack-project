<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bloom &amp; Co. - plants for every home">
  <title>Log in | Bloom &amp; Co.</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="wrap bar">
    <a class="logo" href="index.html">🌿 Bloom <span>&amp;</span> Co.</a>
    <button class="menu-btn" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <nav id="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="tools.html">Tools</a>
      <a href="signup.html" class="pill">Sign up / Log in</a>
    </nav>
  </div>
</header>
<main>

  <section class="wrap narrow">
    <h1>Log in</h1>
    <p id="welcomeBack" class="ok" hidden></p>
    <form id="loginForm" class="form" novalidate>
      <label>Email <input type="email" id="lEmail"></label><small class="err" data-for="lEmail"></small>
      <label>Password <input type="password" id="lPass"></label><small class="err" data-for="lPass"></small>
      <button class="btn" type="submit">Log in</button>
      <p>No account? <a href="signup.html">Sign up</a></p>
    </form>
  </section>
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>&copy; 2026 Bloom &amp; Co. &middot; Modules 1&ndash;5 static site</p>
  </div>
</footer>
</body>
</html>
